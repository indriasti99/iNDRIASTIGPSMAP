    name: Build Android APK

    on:
      workflow_dispatch:
      push:
        branches:
          - '**'

    permissions:
      contents: read

    jobs:
      build:
        name: Build Debug APK
        runs-on: ubuntu-latest

        steps:
          - name: Checkout Repository
            uses: actions/checkout@v4

          - name: Setup Node.js (v20)
            uses: actions/setup-node@v4
            with:
              node-version: 20

          - name: Setup Java JDK 17
            uses: actions/setup-java@v4
            with:
              distribution: 'temurin'
              java-version: '17'

          - name: Install Dependencies
            run: |
              if [ -f package-lock.json ]; then
                npm ci || npm install
              else
                npm install
              fi

          - name: Build Web Assets (www/)
            run: npm run build

          - name: Prepare Android Platform
            run: |
              if [ ! -d "android" ]; then
                echo "Folder android belum ada, membuat folder native otomatis dengan Capacitor..."
                npx cap add android
              fi
              node setup-android.js
              npx cap sync android

          - name: Set Executable Permission on Gradle Wrapper
            run: chmod +x android/gradlew

          - name: Build Debug APK with Gradle
            run: |
              cd android
              ./gradlew assembleDebug --stacktrace

          - name: Verify Generated APK
            run: |
              APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
              if [ ! -f "$APK_PATH" ]; then
                echo "::error::File APK tidak ditemukan pada path: $APK_PATH"
                exit 1
              fi
              echo "=========================================================="
              echo "✅ APK BERHASIL DIBUAT DENGAN SUKSES!"
              ls -lh "$APK_PATH"
              echo "=========================================================="

          - name: Upload Debug APK Artifact
            uses: actions/upload-artifact@v4
            with:
              name: iNDRIASTIGPSMAP-debug-apk
              path: android/app/build/outputs/apk/debug/app-debug.apk
              if-no-files-found: error
              retention-days: 30
