<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="6"/>

  <!-- Satellite Grid Lines -->
  <circle cx="256" cy="230" r="190" fill="none" stroke="rgba(56, 189, 248, 0.15)" stroke-width="2" stroke-dasharray="6 6"/>
  <circle cx="256" cy="230" r="135" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="2"/>
  <line x1="66" y1="230" x2="446" y2="230" stroke="rgba(56, 189, 248, 0.15)" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="256" y1="40" x2="256" y2="420" stroke="rgba(56, 189, 248, 0.15)" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Camera Body Outline -->
  <rect x="96" y="130" width="320" height="230" rx="36" fill="#1e293b" stroke="#38bdf8" stroke-width="8"/>
  <path d="M 196 130 L 226 90 L 286 90 L 316 130 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="6"/>

  <!-- Lens -->
  <circle cx="256" cy="245" r="86" fill="#0f172a" stroke="#64748b" stroke-width="8"/>
  <circle cx="256" cy="245" r="74" fill="url(#lensGrad)"/>
  <circle cx="256" cy="245" r="54" fill="#090d16"/>
  <ellipse cx="236" cy="225" rx="26" ry="14" transform="rotate(-30 236 225)" fill="rgba(255,255,255,0.3)"/>

  <!-- GPS Pin -->
  <g transform="translate(320, 100) scale(0.95)">
    <path d="M 40 0 C 17.9 0 0 17.9 0 40 C 0 70 40 110 40 110 C 40 110 80 70 80 40 C 80 17.9 62.1 0 40 0 Z" fill="url(#pinGrad)"/>
    <circle cx="40" cy="40" r="16" fill="#ffffff"/>
    <circle cx="40" cy="40" r="8" fill="#ef4444"/>
  </g>

  <!-- Typography: iNDRIASTIGPSMAP -->
  <rect x="50" y="405" width="412" height="72" rx="20" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(56, 189, 248, 0.5)" stroke-width="2"/>
  <text x="256" y="438" font-family="'Segoe UI', 'Montserrat', Arial, sans-serif" font-weight="900" font-size="21" fill="#ffffff" text-anchor="middle" letter-spacing="1">iNDRIASTIGPSMAP</text>
  <text x="256" y="462" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="12" fill="#38bdf8" text-anchor="middle" letter-spacing="2">GPS MAP &amp; TIMESTAMP CAMERA</text>
</svg>
